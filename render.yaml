services:
  - type: web
    name: bwala-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bwala-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: bwala-db
    plan: free
